<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Development of North Eastern Region (MDoNER) - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Shared theme with memory.html */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #1a202c;
        }
        .btn-large {
            transition: transform 0.2s;
        }
        .btn-large:hover {
            transform: scale(1.05);
        }
        .rating-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .rating-card h2 {
            color: #1a1a1a;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .rating-card p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .star {
            font-size: 35px;
            color: #e0e0e0;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.1s ease;
        }

        .star:hover {
            transform: scale(1.15);
        }

        /* Active gold state for selected stars */
        .star.active {
            color: #ffcc00;
        }

        .submit-btn {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        .submit-btn:hover {
            background: #0056b3;
        }

        .submit-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-brain text-6xl"></i>
                <h1 class="text-3xl font-bold">Ministry of Development of North Eastern Region (MDoNER)</h1>
            </div>
            <div class="flex items-center space-x-4">
                <select class="bg-teal-600 text-white text-lg p-2 rounded border border-teal-500 focus:outline-none">
                    <option>English</option>
                    <option>Assamese</option>
                    <option>Bengali</option>
                    <option>Hindi</option>
                </select>
                <button class="bg-teal-800 p-3 rounded-full hover:bg-teal-900 transition">
                    <i class="fas fa-user-nurse text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto p-4 flex flex-col items-center justify-center space-y-8 mt-4">
        <div class="text-center w-full bg-white p-6 rounded-2xl shadow-sm border-2 border-teal-100">
            <h2 class="text-4xl font-bold text-teal-800 mb-2">Hello! <i class="fas fa-sun text-yellow-500"></i></h2>
            <p class="text-2xl text-gray-600">Welcome back. What would you like to do today?</p>
            <p class="text-xl text-gray-500 mt-2 font-medium" id="datetime-display"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <a href="games.html" class="btn-large bg-blue-100 border-4 border-blue-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-blue-200">
                <div class="bg-blue-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-gamepad text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-blue-900">Play Games</h3>
                <p class="text-xl text-blue-700 mt-2 text-center">Memory, 2048, Sudoku & Jigsaw</p>
            </a>

            <button class="btn-large bg-rose-100 border-4 border-rose-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-rose-200 relative">
                <span class="absolute top-4 right-4 bg-red-500 text-white text-xl font-bold px-4 py-1 rounded-full animate-bounce">1</span>
                <div class="bg-rose-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-pills text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-rose-900">Reminders</h3>
                <p class="text-xl text-rose-700 mt-2 text-center">Medicine, hydration, appointments</p>
            </button>

            <button class="btn-large bg-purple-100 border-4 border-purple-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-purple-200">
                <div class="bg-purple-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-users text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-purple-900">Family</h3>
                <p class="text-xl text-purple-700 mt-2 text-center">Photos & video calls</p>
            </button>

            <button class="btn-large bg-orange-100 border-4 border-orange-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-orange-200">
                <div class="bg-orange-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-calendar-check text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-orange-900">My Day</h3>
                <p class="text-xl text-orange-700 mt-2 text-center">Schedule & activities</p>
            </button>
        </div>
        <div class="rating-card bg-white p-6 rounded-2xl shadow-sm border-2 border-indigo-100 mb-8">
            <h2 class="text-3xl font-bold text-indigo-800 mb-4">Rate Us</h2>
            <p class="text-lg text-gray-700 mb-4">Your feedback helps us improve. How was your experience?</p>
            <div class="stars flex justify-center space-x-2 mb-4" id="star-container">
                <span class="star text-3xl text-gray-400 cursor-pointer" data-value="1">&#9733;</span>
                <span class="star text-3xl text-gray-400 cursor-pointer" data-value="2">&#9733;</span>
                <span class="star text-3xl text-gray-400 cursor-pointer" data-value="3">&#9733;</span>
                <span class="star text-3xl text-gray-400 cursor-pointer" data-value="4">&#9733;</span>
                <span class="star text-3xl text-gray-400 cursor-pointer" data-value="5">&#9733;</span>
            </div>
            <button class="btn-large bg-green-100 border-4 border-green-400 w-full max-w-xs mx-auto text-center text-xl font-bold text-green-900 py-3 rounded-3xl hover:bg-green-200 disabled:opacity-50" id="submit-rating" disabled>Submit Review</button>
        </div>

    </main>

    <script>
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
            document.getElementById('datetime-display').innerText = now.toLocaleDateString('en-US', options);
        }
        updateTime();
        setInterval(updateTime, 60000);
         const stars = document.querySelectorAll('.star');
        const submitBtn = document.getElementById('submit-rating');
        let selectedRating = 0;

        // Highlight stars on click
        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                selectedRating = index + 1;
                updateStars(selectedRating);
                submitBtn.disabled = false; // Enable button once a rating is chosen
            });
        });

        // Function to update visual state of stars
        function updateStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // Action when user clicks submit
        submitBtn.addEventListener('click', () => {
            alert(`Thank you! You rated us ${selectedRating} out of 5 stars.`);
            
            // Optional: Send data to your server here via fetch() API
            // Reset state
            selectedRating = 0;
            updateStars(0);
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
