<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Day - Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Pacifico&family=Indie+Flower&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --page-bg: #fdfbf7;
            --line-color: #e0d8c8;
        }

        body {
            background-color: #f0e6d2;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Prevent scrolling on body */
        }

        /* Toolbar */
        .toolbar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            z-index: 50;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: max-content;
            max-width: 95vw;
        }

        .book {
            display: flex;
            width: 100%;
            max-width: 1100px;
            height: 82vh; /* Fits within viewport */
            background: var(--page-bg);
            border-radius: 10px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4),
                inset 0 0 50px rgba(0,0,0,0.1);
            position: relative;
            transition: background 0.3s;
        }

        .book::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0) 100%);
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
        }

        .page {
            flex: 1;
            padding: 30px 40px 60px 40px;
            position: relative;
            overflow: hidden; /* No scrolling in pages */
            display: flex;
            flex-direction: column;
            width: 50%;
        }

        .page-left {
            border-right: 1px solid var(--line-color);
        }

        .page-right {
            border-left: 1px solid var(--line-color);
        }

        .ruled-bg {
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 2em;
            line-height: 2em;
        }

        #journal-editor {
            width: 100%;
            flex-grow: 1;
            outline: none;
            font-size: 1.2rem;
            color: #2c3e50;
            z-index: 5;
            position: relative;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
        }
        
        #journal-editor[data-empty="true"]::before {
            content: attr(data-placeholder);
            color: #999;
            pointer-events: none;
            display: block;
        }

        /* Grammar Highlights */
        .grammar-highlight {
            border-bottom: 2px wavy #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            cursor: pointer;
            position: relative;
        }

        .grammar-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 1px solid #e5e7eb;
            padding: 8px;
            border-radius: 6px;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            font-family: sans-serif;
            font-size: 12px;
            color: #374151;
        }

        .grammar-highlight:hover .grammar-tooltip {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fix-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Pagination */
        .pagination-controls {
            position: absolute;
            bottom: 15px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Canvas */
        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 20;
        }
        .drawing-mode #doodle-canvas {
            pointer-events: auto;
            cursor: crosshair;
        }

        .entry-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 20px;
            border-radius: 8px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .entry-image {
            max-height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid #fff;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .entry-image:hover {
            transform: scale(1.05);
        }

        .activity-tag {
            display: inline-block;
            background: rgba(255,255,255,0.7);
            color: #5d4037;
            border: 1px solid #e0d8c8;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar text-sm text-gray-700 font-sans">
        <a href="index.html" class="font-bold text-teal-700 mr-2 hover:text-teal-900"><i class="fas fa-home"></i> Home</a>
        
        <!-- Font Selection -->
        <div class="flex items-center gap-1 border-l pl-3 ml-1">
            <i class="fas fa-font text-gray-400"></i>
            <select id="font-select" class="border rounded px-2 py-1 outline-none bg-gray-50">
                <option value="'Georgia', serif">Classic Georgia</option>
                <option value="'Caveat', cursive">Trendy Caveat</option>
                <option value="'Dancing Script', cursive">Dancing Script</option>
                <option value="'Pacifico', cursive">Pacifico</option>
                <option value="'Indie Flower', cursive">Indie Flower</option>
            </select>
        </div>

        <!-- Color Selection -->
        <div class="flex items-center gap-1 border-l pl-3 ml-1">
            <i class="fas fa-palette text-gray-400"></i>
            <input type="color" id="page-color" value="#fdfbf7" title="Book Color" class="w-6 h-6 rounded cursor-pointer border-0 p-0">
        </div>

        <!-- AI Text Correct -->
        <div class="border-l pl-3 ml-1">
            <button id="ai-correct-btn" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1 rounded shadow-sm transition">
                <i class="fas fa-wand-magic-sparkles"></i> AI Text Review
            </button>
        </div>

        <!-- Doodles -->
        <div class="flex items-center gap-2 border-l pl-3 ml-1">
            <span class="text-gray-400"><i class="fas fa-paint-brush"></i> Doodles:</span>
            <button id="draw-mode-btn" class="hover:bg-gray-200 px-2 py-1 rounded" title="Toggle Draw Mode"><i class="fas fa-pen"></i></button>
            <button id="ai-doodle-btn" class="hover:bg-gray-200 px-2 py-1 rounded" title="AI Auto Doodle"><i class="fas fa-robot"></i></button>
            <button id="undo-btn" class="hover:bg-gray-200 px-2 py-1 rounded" title="Undo"><i class="fas fa-undo"></i></button>
            <button id="redo-btn" class="hover:bg-gray-200 px-2 py-1 rounded" title="Redo"><i class="fas fa-redo"></i></button>
            <button id="clear-doodle-btn" class="hover:bg-red-100 px-2 py-1 rounded text-red-500" title="Clear Canvas"><i class="fas fa-trash"></i></button>
        </div>
    </div>

    <div class="book" id="book">
        
        <!-- Left Page: Past Entries -->
        <div class="page page-left" id="left-page">
            <h2 class="text-3xl text-[#5d4037] mb-2 text-center" style="font-family: 'Brush Script MT', cursive;">My Memories</h2>
            
            <!-- Search Section -->
            <div class="mb-3 flex gap-2 w-full font-sans">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute left-2.5 top-2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="Search by text/date..." class="w-full pl-8 pr-2 py-1 border rounded-lg text-xs bg-white/70 outline-none focus:border-[#5d4037]">
                </div>
                <input type="date" id="date-picker-search" class="border rounded-lg px-2 py-1 text-xs bg-white/70 outline-none focus:border-[#5d4037]">
            </div>

            <div id="entry-display" class="flex-grow flex flex-col items-center justify-center overflow-hidden">
                <!-- Single entry rendered here -->
                <div id="empty-state" class="text-center text-gray-400 italic font-sans">
                    No memories yet. Start journaling!
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination-controls font-sans">
                <button id="prev-entry" class="text-gray-500 hover:text-black hidden transition bg-white/50 px-2 rounded shadow-sm text-xs"><i class="fas fa-chevron-left"></i> Prev</button>
                <span id="page-indicator" class="text-gray-400 text-xs mx-auto"></span>
                <button id="next-entry" class="text-gray-500 hover:text-black hidden transition bg-white/50 px-2 rounded shadow-sm text-xs">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Right Page: New Entry -->
        <div class="page page-right ruled-bg relative" id="right-page">
            <!-- Canvas Overlay for Doodles -->
            <canvas id="doodle-canvas"></canvas>
            
            <h2 class="text-3xl text-[#5d4037] mb-2 text-center" style="font-family: 'Brush Script MT', cursive;" id="current-date"></h2>
            
            <form id="journal-form" class="h-full flex flex-col relative z-10 pointer-events-none">
                <!-- Form elements have pointer-events-auto so they can be clicked even if canvas is above, unless in draw mode -->
                <div id="journal-editor" class="journal-input ruled-bg pointer-events-auto" contenteditable="true" data-placeholder="Dear Diary..." data-empty="true"></div>
                
                <div class="mt-2 bg-white/90 p-3 rounded-xl border border-[#d4c8b0] shadow-sm pointer-events-auto">
                    <!-- Activities -->
                    <div class="mb-2">
                        <label class="text-xs text-gray-600 block mb-1 font-sans font-semibold">Activities:</label>
                        <div class="flex flex-wrap gap-1 max-h-[60px] overflow-y-auto" id="activity-options">
                            <!-- Populated dynamically -->
                        </div>
                        <div class="mt-2 flex gap-1">
                            <input type="text" id="custom-activity-input" placeholder="Add custom activity..." class="border rounded px-2 py-0.5 text-xs flex-grow outline-none font-sans">
                            <button type="button" id="add-custom-activity-btn" class="bg-teal-600 text-white px-2 py-0.5 rounded text-xs font-sans hover:bg-teal-700 transition">Add</button>
                        </div>
                    </div>
                    
                    <!-- Photos Upload & Previews -->
                    <div class="mb-2 border-t pt-2">
                        <div class="flex items-center justify-between">
                            <label for="image-upload" class="cursor-pointer inline-flex items-center gap-1 text-xs text-[#5d4037] hover:bg-gray-50 font-sans font-semibold bg-white px-2 py-1 border border-[#d4c8b0] rounded shadow-sm transition">
                                <i class="fas fa-camera"></i> Upload Photos
                            </label>
                            <input type="file" id="image-upload" accept="image/*" class="hidden" multiple>
                            <span id="image-count" class="text-xs text-gray-500 font-sans">0 photos selected</span>
                        </div>
                        <div id="image-previews-container" class="flex flex-wrap gap-2 mt-2 max-h-[50px] overflow-y-auto"></div>
                    </div>
                    
                    <!-- Actions -->
                    <div class="flex items-center justify-end gap-2 border-t pt-2">
                        <button type="button" id="clear-page-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-1 text-sm rounded shadow font-sans font-semibold transition">
                            Clear Page
                        </button>
                        <button type="submit" class="bg-[#5d4037] text-white px-4 py-1 text-sm rounded shadow hover:bg-[#4e342e] font-sans font-semibold transition">
                            Save Page
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Full Screen Image Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/90 hidden z-[100] flex flex-col justify-center items-center">
        <button id="close-modal" class="absolute top-4 right-4 text-white text-3xl hover:text-gray-300 transition">
            <i class="fas fa-times"></i>
        </button>
        <img id="modal-img" class="max-w-[90vw] max-h-[80vh] object-contain border-4 border-white rounded shadow-2xl">
        <div class="mt-4 flex gap-4">
            <button id="download-img-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-sans font-semibold transition flex items-center gap-2">
                <i class="fas fa-download"></i> Save Image
            </button>
        </div>
    </div>

    <script>
        // --- 1. Basic Setup & State ---
        const dateDisplay = document.getElementById('current-date');
        const now = new Date();
        dateDisplay.innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const book = document.getElementById('book');
        const journalEditor = document.getElementById('journal-editor');
        
        // Editor Placeholder Logic
        journalEditor.addEventListener('input', function() {
            if(this.textContent.trim() === '') {
                this.setAttribute('data-empty', 'true');
            } else {
                this.setAttribute('data-empty', 'false');
            }
        });

        // --- 2. Customization (Font & Color) ---
        const fontSelect = document.getElementById('font-select');
        let currentEditorFont = "'Georgia', serif";
        fontSelect.addEventListener('change', (e) => {
            currentEditorFont = e.target.value;
            journalEditor.style.fontFamily = currentEditorFont;
        });

        const colorPicker = document.getElementById('page-color');
        colorPicker.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--page-bg', e.target.value);
        });

        // --- 3. Custom Activities ---
        let customActivities = JSON.parse(localStorage.getItem('customActivities')) || [];
        const customActivityInput = document.getElementById('custom-activity-input');
        const addCustomActivityBtn = document.getElementById('add-custom-activity-btn');
        const activityOptionsContainer = document.getElementById('activity-options');

        function renderActivityOptions() {
            const defaults = ["Reading", "Exercise", "Family", "Games"];
            activityOptionsContainer.innerHTML = '';
            
            const allActivities = [...defaults, ...customActivities];
            allActivities.forEach(act => {
                const label = document.createElement('label');
                label.className = 'cursor-pointer';
                label.innerHTML = `
                    <input type="checkbox" value="${act}" class="hidden peer">
                    <span class="px-2 py-1 bg-gray-100 peer-checked:bg-blue-100 peer-checked:text-blue-700 border rounded-full text-xs font-sans transition-colors inline-block">${act}</span>
                `;
                activityOptionsContainer.appendChild(label);
            });
        }

        addCustomActivityBtn.addEventListener('click', () => {
            const newAct = customActivityInput.value.trim();
            if (newAct && !customActivities.includes(newAct)) {
                customActivities.push(newAct);
                localStorage.setItem('customActivities', JSON.stringify(customActivities));
                customActivityInput.value = '';
                renderActivityOptions();
            }
        });

        renderActivityOptions();

        // --- 4. AI Text Correction Mock ---
        const aiCorrectBtn = document.getElementById('ai-correct-btn');
        const commonMistakes = {
            'teh': 'the',
            'alot': 'a lot',
            'recieve': 'receive',
            'awsome': 'awesome',
            'i': 'I',
            'im': "I'm",
            'cant': "can't"
        };

        aiCorrectBtn.addEventListener('click', () => {
            let html = journalEditor.innerHTML;
            let count = 0;
            
            // Basic regex to find isolated words matching our mistake dictionary
            Object.keys(commonMistakes).forEach(wrong => {
                const regex = new RegExp(`\\b${wrong}\\b`, 'gi');
                html = html.replace(regex, (match) => {
                    count++;
                    return `<span class="grammar-highlight" id="mistake-${count}">${match}
                        <span class="grammar-tooltip font-sans" contenteditable="false">
                            Change to: <b>${commonMistakes[wrong]}</b> 
                            <button class="fix-btn ml-2" onclick="applyFix('mistake-${count}', '${commonMistakes[wrong]}')">Fix</button>
                        </span>
                    </span>`;
                });
            });
            
            if(count > 0) {
                journalEditor.innerHTML = html;
            } else {
                alert("AI: Your text looks great! No obvious mistakes found.");
            }
        });

        window.applyFix = function(id, correction) {
            const span = document.getElementById(id);
            if(span) {
                span.outerHTML = correction; // Replace the whole span with the corrected text
            }
        };

        // --- 5. Multiple Images Handling ---
        const imageUpload = document.getElementById('image-upload');
        const imageCountLabel = document.getElementById('image-count');
        const imagePreviewsContainer = document.getElementById('image-previews-container');
        let currentImagesBase64 = [];

        imageUpload.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        currentImagesBase64.push(event.target.result);
                        renderImagePreviews();
                    };
                    reader.readAsDataURL(file);
                });
            }
        });

        function renderImagePreviews() {
            imagePreviewsContainer.innerHTML = '';
            currentImagesBase64.forEach((base64, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative w-12 h-12';
                wrapper.innerHTML = `
                    <img src="${base64}" class="w-full h-full object-cover rounded border">
                    <button type="button" onclick="removePreviewImage(${index})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]"><i class="fas fa-times"></i></button>
                `;
                imagePreviewsContainer.appendChild(wrapper);
            });
            imageCountLabel.textContent = `${currentImagesBase64.length} photos selected`;
        }

        window.removePreviewImage = function(index) {
            currentImagesBase64.splice(index, 1);
            renderImagePreviews();
        };

        // --- 6. Fullscreen Image Modal ---
        const imageModal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        const closeModal = document.getElementById('close-modal');
        const downloadImgBtn = document.getElementById('download-img-btn');

        window.zoomImage = function(src) {
            modalImg.src = src;
            imageModal.classList.remove('hidden');
        };

        closeModal.addEventListener('click', () => {
            imageModal.classList.add('hidden');
        });

        downloadImgBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = modalImg.src;
            a.download = `diary-photo-${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // --- 7. Search & Pagination (Left Page) ---
        const entryDisplay = document.getElementById('entry-display');
        const prevEntryBtn = document.getElementById('prev-entry');
        const nextEntryBtn = document.getElementById('next-entry');
        const pageIndicator = document.getElementById('page-indicator');
        const searchInput = document.getElementById('search-input');
        const datePickerSearch = document.getElementById('date-picker-search');
        
        let entries = JSON.parse(localStorage.getItem('diaryEntries')) || [];
        let displayedEntries = [];
        let currentPageIndex = 0; // 0 is newest

        function filterEntries() {
            const query = searchInput.value.toLowerCase().trim();
            const dateQuery = datePickerSearch.value; // YYYY-MM-DD
            
            let filtered = [...entries];
            
            if (dateQuery) {
                filtered = filtered.filter(entry => {
                    const entryDate = new Date(entry.timestamp);
                    const y = entryDate.getFullYear();
                    const m = String(entryDate.getMonth() + 1).padStart(2, '0');
                    const d = String(entryDate.getDate()).padStart(2, '0');
                    const entryDateString = `${y}-${m}-${d}`;
                    return entryDateString === dateQuery;
                });
            }
            
            if (query) {
                filtered = filtered.filter(entry => {
                    const dateObj = new Date(entry.timestamp);
                    const dateString = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toLowerCase();
                    const textMatch = entry.text.toLowerCase().includes(query);
                    const dateMatch = dateString.includes(query);
                    const activityMatch = entry.activities && entry.activities.some(act => act.toLowerCase().includes(query));
                    return textMatch || dateMatch || activityMatch;
                });
            }
            
            return filtered;
        }

        function updateDisplayedEntries() {
            displayedEntries = filterEntries();
            currentPageIndex = 0; // reset to first matching result
            renderEntries();
        }

        searchInput.addEventListener('input', updateDisplayedEntries);
        datePickerSearch.addEventListener('change', updateDisplayedEntries);

        function renderEntries() {
            entries.sort((a, b) => b.timestamp - a.timestamp); // Sort original list first

            if (displayedEntries.length === 0) {
                entryDisplay.innerHTML = `<div id="empty-state" class="text-center text-gray-400 italic font-sans">No matching memories found.</div>`;
                prevEntryBtn.classList.add('hidden');
                nextEntryBtn.classList.add('hidden');
                pageIndicator.innerText = '';
                return;
            }

            const entry = displayedEntries[currentPageIndex];
            const dateStr = new Date(entry.timestamp).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            let tagsHtml = '';
            if (entry.activities && entry.activities.length > 0) {
                tagsHtml = '<div class="mt-4 border-t border-[#e0d8c8] pt-2">';
                entry.activities.forEach(act => {
                    tagsHtml += `<span class="activity-tag">${act}</span>`;
                });
                tagsHtml += '</div>';
            }

            let imgHtml = '';
            if (entry.images && entry.images.length > 0) {
                imgHtml = '<div class="grid grid-cols-3 gap-2 mt-4 max-h-[120px] overflow-y-auto p-1">';
                entry.images.forEach(img => {
                    imgHtml += `<img src="${img}" class="entry-image cursor-pointer hover:opacity-90 transition w-full h-[60px]" onclick="zoomImage('${img}')" alt="Memory photo">`;
                });
                imgHtml += '</div>';
            } else if (entry.image) {
                imgHtml = `<div class="mt-4"><img src="${entry.image}" class="entry-image cursor-pointer hover:opacity-90 transition mx-auto h-[80px]" onclick="zoomImage('${entry.image}')" alt="Memory photo"></div>`;
            }

            const entryFont = entry.font || "'Georgia', serif";

            entryDisplay.innerHTML = `
                <div class="entry-card w-full relative" style="font-family: ${entryFont};">
                    ${entry.doodle ? `<img src="${entry.doodle}" class="absolute inset-0 w-full h-full pointer-events-none z-10 opacity-80">` : ''}
                    <div class="text-sm text-gray-500 mb-2 border-b border-[#e0d8c8] pb-1 font-sans flex justify-between items-center z-20 relative">
                        <span>${dateStr}</span>
                        <button onclick="deleteEntry(${entry.id})" class="text-red-500 hover:text-red-700 hover:scale-105 transition" title="Delete Memory"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="entry-text text-gray-800 text-lg flex-grow overflow-y-auto pr-1 z-25 relative" style="line-height: 1.6;">${entry.text}</div>
                    ${imgHtml}
                    ${tagsHtml}
                </div>
            `;

            pageIndicator.innerText = `Page ${currentPageIndex + 1} of ${displayedEntries.length}`;
            
            if (currentPageIndex > 0) prevEntryBtn.classList.remove('hidden');
            else prevEntryBtn.classList.add('hidden');

            if (currentPageIndex < displayedEntries.length - 1) nextEntryBtn.classList.remove('hidden');
            else nextEntryBtn.classList.add('hidden');
        }

        prevEntryBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderEntries();
            }
        });

        nextEntryBtn.addEventListener('click', () => {
            if (currentPageIndex < displayedEntries.length - 1) {
                currentPageIndex++;
                renderEntries();
            }
        });

        window.deleteEntry = function(id) {
            if(confirm("Are you sure you want to delete this memory page?")) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('diaryEntries', JSON.stringify(entries));
                updateDisplayedEntries();
            }
        };

        // Initialize displayedEntries and render
        updateDisplayedEntries();

        // --- 8. Save & Clear Page Actions ---
        const clearPageBtn = document.getElementById('clear-page-btn');
        clearPageBtn.addEventListener('click', () => {
            if(confirm("Clear this page? All text, uploaded images, and doodles on this page will be cleared.")) {
                resetRightPage();
            }
        });

        function resetRightPage() {
            journalEditor.innerHTML = '';
            journalEditor.setAttribute('data-empty', 'true');
            currentImagesBase64 = [];
            renderImagePreviews();
            imageUpload.value = '';
            document.querySelectorAll('#activity-options input[type="checkbox"]').forEach(cb => cb.checked = false);
            clearCanvas();
        }

        const form = document.getElementById('journal-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let rawHtml = journalEditor.innerHTML;
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawHtml;
            tempDiv.querySelectorAll('.grammar-tooltip').forEach(el => el.remove());
            const cleanText = tempDiv.innerText || tempDiv.textContent;

            if(!cleanText.trim() && currentImagesBase64.length === 0 && !drawnPaths.length) return;

            const activityCheckboxes = document.querySelectorAll('#activity-options input[type="checkbox"]:checked');
            const activities = Array.from(activityCheckboxes).map(cb => cb.value);
            
            // Save canvas doodle if drawn
            let doodleData = null;
            if(drawnPaths.length > 0 && drawnPaths[drawnPaths.length - 1] !== "empty") {
                doodleData = canvas.toDataURL();
            }

            const newEntry = {
                id: Date.now(),
                timestamp: Date.now(),
                text: cleanText,
                activities: activities,
                images: currentImagesBase64,
                doodle: doodleData,
                font: currentEditorFont // Save selected font for this page
            };
            
            entries.push(newEntry);
            localStorage.setItem('diaryEntries', JSON.stringify(entries));
            
            resetRightPage();
            updateDisplayedEntries();
        });


        // --- 9. Doodle Canvas & AI Doodles ---
        const canvas = document.getElementById('doodle-canvas');
        const ctx = canvas.getContext('2d');
        const rightPage = document.getElementById('right-page');
        
        let isDrawing = false;
        let isDrawMode = false;
        
        let drawnPaths = []; 
        let redoStack = [];

        function resizeCanvas() {
            canvas.width = rightPage.clientWidth;
            canvas.height = rightPage.clientHeight;
            restoreCanvasState();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100); 

        const drawModeBtn = document.getElementById('draw-mode-btn');
        drawModeBtn.addEventListener('click', () => {
            isDrawMode = !isDrawMode;
            if(isDrawMode) {
                rightPage.classList.add('drawing-mode');
                drawModeBtn.classList.add('bg-blue-200');
            } else {
                rightPage.classList.remove('drawing-mode');
                drawModeBtn.classList.remove('bg-blue-200');
            }
        });

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if(!isDrawMode) return;
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#374151'; 
            redoStack = [];
        });

        canvas.addEventListener('mousemove', (e) => {
            if(!isDrawing || !isDrawMode) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => {
            if(!isDrawing) return;
            isDrawing = false;
            saveCanvasState();
        });
        canvas.addEventListener('mouseout', () => {
            if(isDrawing) {
                isDrawing = false;
                saveCanvasState();
            }
        });

        function saveCanvasState() {
            drawnPaths.push(canvas.toDataURL());
        }

        function restoreCanvasState() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(drawnPaths.length > 0 && drawnPaths[drawnPaths.length - 1] !== "empty") {
                const img = new Image();
                img.src = drawnPaths[drawnPaths.length - 1];
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                }
            }
        }

        document.getElementById('undo-btn').addEventListener('click', () => {
            if(drawnPaths.length > 0) {
                redoStack.push(drawnPaths.pop()); 
                restoreCanvasState();
            }
        });

        document.getElementById('redo-btn').addEventListener('click', () => {
            if(redoStack.length > 0) {
                drawnPaths.push(redoStack.pop());
                restoreCanvasState();
            }
        });

        function clearCanvas() {
            if(drawnPaths.length > 0) redoStack.push(drawnPaths[drawnPaths.length - 1]);
            drawnPaths.push("empty"); 
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        document.getElementById('clear-doodle-btn').addEventListener('click', clearCanvas);

        // AI Doodle Simulation
        const aiDoodles = ['🌸', '✨', '☀️', '☕', '🎨', '💖', '🌱'];
        document.getElementById('ai-doodle-btn').addEventListener('click', () => {
            const randomDoodle = aiDoodles[Math.floor(Math.random() * aiDoodles.length)];
            const x = Math.random() * (canvas.width - 50) + 20;
            const y = Math.random() * (canvas.height - 150) + 50;
            
            ctx.font = '30px Arial';
            ctx.fillText(randomDoodle, x, y);
            saveCanvasState();
        });

    </script>
</body>
</html>
