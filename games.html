<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smriti NER - Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #1a202c;
        }
        .btn-large {
            transition: transform 0.2s;
        }
        .btn-large:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="hover:text-teal-200 transition">
                    <i class="fas fa-arrow-left text-3xl"></i>
                </a>
                <i class="fas fa-brain text-3xl ml-4"></i>
                <h1 class="text-3xl font-bold">Smriti NER</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button class="bg-teal-800 p-3 rounded-full hover:bg-teal-900 transition">
                    <i class="fas fa-user-nurse text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-4xl mx-auto p-4 flex flex-col items-center justify-center space-y-8 mt-4">
        
        <!-- Header Message -->
        <div class="text-center w-full bg-white p-6 rounded-2xl shadow-sm border-2 border-teal-100">
            <h2 class="text-4xl font-bold text-teal-800 mb-2">Play Games <i class="fas fa-puzzle-piece text-blue-500"></i></h2>
            <p class="text-2xl text-gray-600">Choose a game to keep your mind sharp and have fun!</p>
        </div>

        <!-- Games Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            
            <!-- Memory Matching -->
            <button class="btn-large bg-indigo-100 border-4 border-indigo-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-indigo-200" onclick="window.location.href='memory.html'">
                <div class="bg-indigo-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-clone text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-indigo-900 text-center">Memory Cards</h3>
                <p class="text-xl text-indigo-700 mt-2 text-center">Match the picture pairs</p>
            </button>

            <!-- 2048 -->
            <button class="btn-large bg-amber-100 border-4 border-amber-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-amber-200" onclick="window.location.href='2048.html'">
                <div class="bg-amber-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-superscript text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-amber-900 text-center">2048 Math</h3>
                <p class="text-xl text-amber-700 mt-2 text-center">Slide and match numbers</p>
            </button>

            <!-- Sudoku -->
            <button class="btn-large bg-emerald-100 border-4 border-emerald-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-emerald-200" onclick="window.location.href='sudoku.html'">
                <div class="bg-emerald-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-th text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-emerald-900 text-center">Sudoku</h3>
                <p class="text-xl text-emerald-700 mt-2 text-center">Number logic puzzle</p>
            </button>

            <!-- Jigsaw Explorer -->
            <button class="btn-large bg-pink-100 border-4 border-pink-400 p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-pink-200" onclick="window.location.href='jigsaw.html'">
                <div class="bg-pink-500 text-white p-6 rounded-full mb-4">
                    <i class="fas fa-shapes text-5xl"></i>
                </div>
                <h3 class="text-3xl font-bold text-pink-900 text-center">Jigsaw Explorer</h3>
                <p class="text-xl text-pink-700 mt-2 text-center">Solve picture puzzles</p>
            </button>

        </div>

    </main>

</body>
</html>
